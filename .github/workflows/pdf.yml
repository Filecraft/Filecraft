name: PDF shared operations and CLI
on:
  push:
    paths: ['pdf/**', '.github/workflows/pdf.yml', 'LICENSE', 'NOTICE']
  pull_request:
    paths: ['pdf/**', '.github/workflows/pdf.yml', 'LICENSE', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Real PDF API and CLI tests
        run: node --test pdf/test/*.test.cjs
      - name: Independent PDFium and extracted-package tests
        run: |
          python -m pip install pypdfium2==4.30.0
          python -m unittest discover -s pdf/test -p "*_test.py"
      - name: Build source distribution
        run: python pdf/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pdf-cli-${{ runner.os }}
          path: pdf/dist/*.zip*
          if-no-files-found: error
