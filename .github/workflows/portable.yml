name: Windows and Linux offline companion
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6, Node 24 runtime
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6, Node 24 runtime
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        working-directory: portable
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox
          python -m pip install pymupdf==1.26.5
      - name: Generate self-contained PDF worker
        run: python scripts/package_workbench.py --sync
      - name: Run offline file URL workflows
        working-directory: portable
        run: npm test
      - name: Independently parse and render exported PDFs
        run: |
          python scripts/check-portable-pdf.py
          python scripts/check-workbench-pdf.py
          python scripts/check-physical-pdf.py
      - name: Verify budgets and package
        run: |
          python scripts/sync_engine.py --check
          python scripts/test_portable_budget.py
          python scripts/package_portable.py
          python scripts/package_workbench.py
          python scripts/package_workbench.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ runner.os }}
          path: |
            build/Prepare-*-portable.zip*
            build/Prepare-*-pdf-workbench.zip*
            build/portable-size.json
            build/portable-evidence/
            build/pdf-workbench-evidence/
          if-no-files-found: error
          retention-days: 14
