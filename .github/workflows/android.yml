name: Android experimental
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'LICENSE', 'NOTICE']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'LICENSE', 'NOTICE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.15+6'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
      - name: Install pinned compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Core tests and unsigned APKs
        run: python3 android/build.py
      - name: Deterministic rebuild and permission gate
        shell: bash
        run: |
          cp android/build/prepare-unsigned.apk.sha256 android/build/first.sha256
          python3 android/build.py
          cmp android/build/first.sha256 android/build/prepare-unsigned.apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions android/build/prepare-unsigned.apk > android/build/permissions.txt
          python3 -c "from pathlib import Path; s=Path('android/build/permissions.txt').read_text(); assert 'uses-permission' not in s, s"
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Real framework pixel and cancellation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: python3 android/test-device.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-experimental-api-${{ matrix.api }}-UNSIGNED
          path: |
            android/build/*-unsigned.apk
            android/build/*.apk.sha256
            android/build/instrumentation.txt
            android/build/permissions.txt
          if-no-files-found: error
