name: Shared document engine and source CLI
on:
  push:
    paths: ['engine/**', '.github/workflows/engine.yml', 'LICENSE']
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Dependency-free tests including real CLI subprocesses
        run: node --test engine/test/boundaries.test.js engine/test/cli.test.js engine/test/engine.test.js engine/test/inspect.test.js engine/test/io-extra.test.js engine/test/workflow.test.js
      - name: Exercise model workflow
        run: node engine/cli.js workflow engine/examples/document.json engine/examples/workflow.json
  source-package:
    needs: node-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python engine/test/package_test.py
      - run: python engine/package.py
      - name: Verify archive checksum
        working-directory: engine/dist
        run: sha256sum -c document-engine-source.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: document-engine-source-node-required
          path: engine/dist/document-engine-source.zip*
          if-no-files-found: error
          retention-days: 14
