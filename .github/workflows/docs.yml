name: Identity and documentation
on:
  push:
    paths: ['docs/**', 'product.json', 'README.md', 'AGENTS.md', 'scripts/test_filecraft_identity.py', '.readthedocs.yaml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'product.json', 'README.md', 'AGENTS.md', 'scripts/test_filecraft_identity.py', '.readthedocs.yaml', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict -f docs/mkdocs.yml
      - run: python scripts/test_filecraft_identity.py
      - run: python scripts/check_product.py
