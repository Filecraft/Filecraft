name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: swift --version
      - name: Debug behavioral checks
        run: swift run PrepareChecks --ui-contract
      - name: Release behavioral checks
        run: swift run -c release PrepareChecks --ui-contract --stress
      - name: Compiler warnings are errors
        run: swift build -c release -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Check website
        run: |
          python3 scripts/check-site.py
          node scripts/test-site.cjs
          python3 scripts/test_release_budget.py
      - name: Package native build
        run: bash scripts/package.sh
      - name: Verify signed bundle
        run: codesign --verify --strict build/Prepare.app
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Prepare-${{ runner.arch }}
          path: |
            build/Prepare-*.zip
            build/Prepare-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
