name: macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: swift --version
      - name: Debug behavioral checks
        run: swift run PrepareChecks
      - name: Release behavioral checks
        run: swift run -c release PrepareChecks
      - name: Compiler warnings are errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Check website
        run: python3 scripts/check-site.py
      - name: Package native build
        run: bash scripts/package.sh
      - name: Verify signed bundle
        run: codesign --verify --strict build/Prepare.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prepare-${{ runner.arch }}
          path: |
            build/Prepare-*.zip
            build/Prepare-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
